spring.application.name=ApexCare Hospital Management System

# Railway provides the port through the PORT environment variable
server.port=${PORT:8080}

# MySQL database - credentials must come from environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Disable schema.sql execution; Hibernate manages entity tables
spring.sql.init.mode=never

# JWT security - configure JWT_SECRET in Railway Variables
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-milliseconds=86400000

# Logging
logging.level.com.apexcare=INFO
logging.level.org.springframework.security=WARN